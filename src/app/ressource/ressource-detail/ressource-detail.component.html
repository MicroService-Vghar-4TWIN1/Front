<div class="card details-card shadow-lg mx-auto">
    <div class="container mt-5">
      <div class="card shadow-lg mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white text-center">
          <h3>Détails de la Ressource</h3>
        </div>
        <div class="card-body">
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
              <i class="fas fa-book-open me-2 text-primary"></i>
              <strong>Titre :</strong> {{ ressource?.titre }}
            </li>
            <li class="list-group-item">
              <i class="fas fa-link me-2 text-success"></i>
              <strong>URL :</strong>
              <a [href]="ressource?.url" target="_blank">{{ ressource?.url }}</a>
            </li>
            <li class="list-group-item">
              <i class="fas fa-file-pdf me-2 text-danger"></i>
              <strong>PDF :</strong> {{ ressource?.pdf }}
            </li>
            <li class="list-group-item">
              <i class="fas fa-align-left me-2 text-warning"></i>
              <strong>Description :</strong> {{ ressource?.description }}
            </li>
            <li class="list-group-item">
              <i class="fas fa-tags me-2 text-info"></i>
              <strong>Type :</strong> {{ ressource?.type }}
            </li>
          </ul>
  
          <!-- Bouton pour générer le résumé -->
          <div class="text-center mt-4">
            <!-- Vérifie si la ressource est disponible avant d'afficher le bouton -->
            <button *ngIf="ressource" (click)="getSummary()" class="btn btn-outline-info">
              <i class="fas fa-file-alt"></i> Générer le résumé
            </button>
          </div>
  
          <!-- Affichage du résumé si disponible -->
          <div *ngIf="summary" class="mt-3 p-3 bg-light border rounded">
            <h4>Résumé du PDF :</h4>
            <p>{{ summary }}</p>
          </div>
  
          <!-- Affichage du message de chargement pendant l'attente -->
          <div *ngIf="loading" class="text-center mt-3">
            <i class="fas fa-spinner fa-spin"></i> Chargement...
          </div>
          <br>
        </div>
        <br>
      </div>
    </div>
  </div>
