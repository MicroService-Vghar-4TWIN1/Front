<div class="container mt-5"> 
  <h2 class="text-center mb-4 fw-bold">Gestion des Équipes</h2>

  <div class="text-center mb-4">
    <button [routerLink]="['/equipe/add']" class="btn custom-add-btn me-2">
      <i class="fas fa-plus me-1"></i> AJOUTER UNE NOUVELLE ÉQUIPE
    </button>

    <button class="btn btn-outline-dark me-2" (click)="exportPDF()">
      <i class="fas fa-file-pdf"></i> Exporter en PDF
    </button>

    <button class="btn btn-outline-primary" (click)="evolveEquipes()">
      <i class="fas fa-sync-alt"></i> Faire Évoluer les Équipes
    </button>

    <google-chart 
      *ngIf="chartData.length > 1"
      [type]="chartType" 
      [data]="chartData" 
      [options]="chartOptions" 
      [width]="1000" 
      [height]="400">
    </google-chart>
  </div>

  <div class="card mx-auto shadow-sm rounded-4" style="max-width: 1000px;">
    <div class="card-header text-white text-center" style="background-color: #1e2a3a;">
      <h4 class="m-0">Liste des Équipes</h4>
      <div class="form-group my-3">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Rechercher par nom ou niveau..." 
          [(ngModel)]="searchTerm" 
          (input)="searchEquipes()">
      </div>
    </div>

    <div class="card-body p-0">
      <div *ngIf="equipes.length === 0" class="alert alert-info m-3 text-center">
        Aucune équipe disponible.
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover text-center align-middle m-0">
          <thead class="table-dark">
            <tr>
              <th>Nom</th>
              <th>Niveau</th>
              <th>Prédite Évolution</th>
              <th>Âge Moyen</th>
              <th>Nombre de Membres</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let equipe of equipes">
              <td>{{ equipe.nomEquipe }}</td>
              <td>{{ equipe.niveau }}</td>
              <td>
                <span *ngIf="equipe.prochaineEvolution; else no">
                  ✅ Oui
                </span>
                <ng-template #no>❌ Non</ng-template>
              </td>
              <td>{{ equipe.ageMoyen }}</td>
              <td>{{ equipe.nbMembres }}</td>
              <td>
                <button 
                  [routerLink]="['/equipe/edit', equipe.idEquipe]" 
                  class="btn btn-warning btn-sm me-1 rounded-pill" 
                  title="Modifier">
                  <i class="fas fa-edit"></i>
                </button>
                <button 
                  (click)="deleteEquipe(equipe.idEquipe!)" 
                  class="btn btn-danger btn-sm me-1 rounded-pill" 
                  title="Supprimer">
                  <i class="fas fa-trash"></i>
                </button>
                <button 
                  class="btn btn-info btn-sm rounded-pill" 
                  (click)="predictEquipe(equipe)" 
                  title="Prédire">
                  🔍 Prédire
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
