<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 class="text-center mb-4">Modifier l'Équipe</h2>

  <form [formGroup]="equipeForm" (ngSubmit)="onUpdate()">
    <div class="nice-form-group">
      <label for="nomEquipe">Nom de l'équipe</label>
      <input type="text" id="nomEquipe" formControlName="nomEquipe" placeholder="Entrez le nom de l'équipe">
      <div *ngIf="equipeForm.get('nomEquipe')?.invalid && equipeForm.get('nomEquipe')?.touched" class="error-message">
        Le nom de l'équipe est requis
      </div>
    </div>

    <div class="nice-form-group">
      <label for="niveau">Niveau</label>
      <select id="niveau" formControlName="niveau">
        <option value="">Sélectionnez un niveau</option>
        <option *ngFor="let niveau of niveaux" [value]="niveau">{{ niveau }}</option>
      </select>
      <div *ngIf="equipeForm.get('niveau')?.invalid && equipeForm.get('niveau')?.touched" class="error-message">
        Le niveau est requis
      </div>
    </div>

    <div class="nice-form-group">
      <label for="nbMembres">Nombre de membres</label>
      <input type="number" id="nbMembres" formControlName="nbMembres">
    </div>

    <div class="nice-form-group">
      <label for="ageMoyen">Âge moyen</label>
      <input type="number" id="ageMoyen" formControlName="ageMoyen">
    </div>

    <div class="nice-form-group">
      <label for="projetsLivres">Projets livrés</label>
      <input type="number" id="projetsLivres" formControlName="projetsLivres">
    </div>

    <div class="nice-form-group" style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px;">
      <button type="button" (click)="cancel()"
              style="padding: 10px 20px; background: #f5f5f5; color: #333; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">
        Annuler
      </button>
      <button type="submit" [disabled]="equipeForm.invalid"
              style="padding: 12px 30px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 1.05em; cursor: pointer; transition: background 0.3s;">
        Mettre à jour
      </button>
    </div>
  </form>
</div>
