<div class="container">
    <h2>Modifier une Aide Financière</h2>
    <form (ngSubmit)="onSubmit()" #financeForm="ngForm">
        

        <label for="amountRequested">Montant demandé (€)</label>
        <input type="number" id="amountRequested" [(ngModel)]="amountRequested" name="amountRequested" min="0" required>

        <label for="reason">Raison </label>
        <input type="text" id="reason" [(ngModel)]="reason" name="reason" required>

       

      

        <button type="submit" class="submit-btn" [disabled]="!financeForm.form.valid">Mettre à jour</button>
    </form>
</div>
