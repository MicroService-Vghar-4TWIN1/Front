<div *ngIf="loading" class="text-center my-3">
    <p>Loading users...</p>
  </div>
  
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>
  
  <div *ngIf="!loading && !error">
    <h2>Liste des utilisateurs Keycloak</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nom d'utilisateur</th>
          <th>Email</th>
          <th>Actif</th>
          <th>Rôles</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.enabled ? 'Oui' : 'Non' }}</td>
          <td>
            <ul>
              <li *ngFor="let role of user.realmRoles || []">{{ role }}</li>
            </ul>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
