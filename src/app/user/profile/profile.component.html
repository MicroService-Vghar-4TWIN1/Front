<div *ngIf="loading">
    <div class="loading-spinner">
      <p>Loading user information...</p>
    </div>
  </div>
  
  
  
  <div *ngIf="hasUserInfo()" class="profile-container">
    <h2>Profile Information</h2>
    <div class="profile-info">
      <p><strong>Username:</strong> {{ userInfo?.preferred_username }}</p>
      <p><strong>Name:</strong> {{ userInfo?.name }}</p>
      <p><strong>Email:</strong> {{ userInfo?.email }}</p>
      <p><strong>Email Verified:</strong> {{ userInfo?.email_verified ? 'Yes' : 'No' }}</p>
      <p><strong>User ID:</strong> {{ userInfo?.sub }}</p>
    </div>
  
    <div *ngIf="userInfo?.realm_access?.roles?.length" class="roles-section">
      <h3>Roles</h3>
      <ul>
        <li *ngFor="let role of userInfo?.realm_access?.roles">{{ role }}</li>
      </ul>
    </div>
  </div>
